[package]
name = "rs_1brc"
version = "0.1.10"
edition = "2024"
description = "The One Billion Row Challenge for RUST"
license = "MIT"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.53", features = ["derive"] }
fork = "0.6.0"
indicatif = "0.18.3"
libc = "0.2.178"
proc-cpuinfo = "0.2.0"
rapidhash = "4.2.0"

[profile.release]
panic = "abort"
debug = true
lto = true
opt-level = 3
